<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Returning to AI Trainer…</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,sans-serif;background:#070b07;color:#e8f5e9;text-align:center;padding:24px}
    h1{font-size:18px;color:#39ff14}
    p{opacity:.85;font-size:14px}
  </style>
</head>
<body>
  <div>
    <h1>Returning to AI Trainer…</h1>
    <p id="m">Opening the app. You can close this tab.</p>
  </div>
<script>
(function () {
  var DEEP = "com.aitrainer.app://auth-callback";
  var hash = window.location.hash || "";
  var search = window.location.search || "";
  if (!hash && /access_token=|refresh_token=/.test(search)) {
    hash = "#" + search.replace(/^\?/, "");
  }
  var target = DEEP + (hash || (search ? "#" + search.replace(/^\?/, "") : ""));

  // Prefer deep link into installed Android app — do NOT open GitHub web app UI
  function go() {
    try { window.location.replace(target); } catch (e) {}
    try { window.location.href = target; } catch (e2) {}
  }
  go();
  setTimeout(go, 400);
  setTimeout(go, 1200);

  // If user is only on web (no APK), keep tokens in localStorage for same-origin later
  try {
    var params = new URLSearchParams((hash || "").replace(/^#/, ""));
    var access = params.get("access_token");
    if (access) {
      localStorage.setItem("ai_trainer_supabase_session", JSON.stringify({
        access_token: access,
        refresh_token: params.get("refresh_token") || "",
        expires_in: Number(params.get("expires_in") || 3600),
        expires_at: Math.floor(Date.now() / 1000) + Number(params.get("expires_in") || 3600),
        savedAt: Date.now()
      }));
    }
  } catch (e) {}
})();
</script>
</body>
</html>
