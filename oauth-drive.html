<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Connecting Drive…</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,sans-serif;background:#070b07;color:#e8f5e9;text-align:center;padding:24px}
    h1{font-size:18px;color:#39ff14}
    p{opacity:.85;font-size:14px}
    a{color:#00e676}
  </style>
</head>
<body>
  <div>
    <h1 id="t">Connecting Google Drive…</h1>
    <p id="m">Returning to AI Trainer. You can close this tab.</p>
    <p><a id="link" href="#">Open AI Trainer</a></p>
  </div>
<script>
(function () {
  var DEEP = "com.aitrainer.app://drive-callback";
  var hash = window.location.hash || "";
  var search = window.location.search || "";
  if (!hash && /access_token=/.test(search)) hash = "#" + search.replace(/^\?/, "");
  var target = DEEP + (hash || "");
  document.getElementById("link").href = target;

  var params = new URLSearchParams((hash || "").replace(/^#/, ""));
  var err = params.get("error") || params.get("error_description");
  if (err) {
    document.getElementById("t").textContent = "Drive connect failed";
    document.getElementById("m").textContent = err;
    return;
  }
  if (!params.get("access_token")) {
    document.getElementById("t").textContent = "No token";
    document.getElementById("m").textContent = "Close this tab and try Connect Google Drive again from the app.";
    return;
  }

  function go() {
    try { window.location.replace(target); } catch (e) {}
    try { window.location.href = target; } catch (e2) {}
  }
  go();
  setTimeout(go, 400);
  setTimeout(go, 1200);
})();
</script>
</body>
</html>
